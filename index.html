<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Pas de "viewport-fit=cover" (retiré) : en PWA installée sur iPhone, il
         demande à iOS d'étendre la webview bord à bord, ce qu'iOS fait
         VISUELLEMENT — mais en gardant un viewport de mise en page amputé de
         la hauteur de la barre d'état. Mesuré sur captures : la page ne
         dessine jamais plus bas que 812pt sur un écran de 874pt, les 62pt
         restants (= env(safe-area-inset-top)) n'étant remplis que par le fond
         propagé de html/body. D'où la nav en "bottom: 0" qui se pose 62pt
         trop haut, et le voile des modales qui ne descend pas jusqu'en bas.
         Vérifié : le style de la barre d'état (black-translucent vs default)
         ne change RIEN à cette valeur — seul "cover" est en cause. Sans lui,
         iOS place la webview dans la zone sûre et les deux hauteurs
         coïncident enfin ; les env(safe-area-inset-*) tombent à 0, ce que les
         quelques règles qui s'en servent absorbent sans dommage (elles sont
         toutes en max()/calc() avec une valeur de repli). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Le manifest et l'enregistrement du service worker sont injectés
         automatiquement par vite-plugin-pwa (voir vite.config.js) — plus
         besoin de <link rel="manifest"> manuel ni de manifest.json à la
         racine, qui a été retiré pour éviter d'avoir deux manifestes
         divergents. -->
    <title>Le Grimoire de Morgane</title>
    <!-- Chargées ici, PAS via @import dans theme.css.js (retiré) : un
         @import doit être la ou les toute(s) première(s) règle(s) d'une
         feuille de style, et tant que la ressource importée n'a pas fini de
         charger, la spec CSS bloque l'application de TOUT LE RESTE de
         CETTE MÊME feuille — pas seulement des règles de police. Le CSS de
         toute l'app tient dans une seule chaîne concaténée injectée par
         AppShell.jsx (voir styles.css.js), et THEME_CSS (qui portait cet
         @import) est le premier morceau concaténé : son import était donc
         littéralement la première ligne de CE bloc <style> unique. Le temps
         de l'aller-retour réseau vers Google Fonts (visible sur captures :
         600-800ms au lancement), l'app entière restait sans AUCUN style —
         pas juste avec une police de repli — puis basculait d'un coup une
         fois l'import résolu, plutôt que la dégradation progressive
         attendue d'une police qui charge. Une vraie balise <link> est une
         ressource indépendante : elle ne bloque que le texte qui utilise
         ces polices (repli sur une police système entre-temps, "&display=
         swap" déjà dans l'URL), jamais le CSS de mise en page/couleurs qui
         n'a rien à voir avec elle. preconnect vers les deux domaines
         (google fonts + le CDN qui sert réellement les fichiers de police)
         accélère cet aller-retour au lieu de se contenter de l'éviter. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
      /* touch-action ne "cascade" pas comme les autres propriétés CSS : la
         valeur EFFECTIVE pour un élément touché est l'INTERSECTION de sa
         propre valeur ET de celle de TOUS ses ancêtres jusqu'à <html>. Avoir
         "manipulation" ici (sur les deux ancêtres racine de toute la page)
         forçait donc la gestion du défilement sur le thread principal au
         lieu du thread de composition rapide — visible dans l'onglet
         Rendering de Chrome ("Scrolling performance issues" / "main thread
         scroll repaint"), et responsable du défilement bloqué/saccadé
         constaté sur Chrome desktop et Android (jamais sur iOS Safari, qui
         implémente cette intersection différemment). Son seul rôle réel —
         bloquer le double-tap pour zoomer — est de toute façon déjà assuré
         par "user-scalable=no" dans la balise viewport ci-dessus, ce qui la
         rendait entièrement redondante. Retirée : chaque élément gère
         désormais son propre touch-action (voir .recipe-card notamment)
         sans restriction globale imposée par la racine.
         overscroll-behavior-y: contain, posé ici un temps pour rester
         cohérent avec les autres conteneurs défilants de l'app, RETIRÉ : en
         mode portrait, c'est le document lui-même (html/body) qui défile —
         aucun conteneur borné à proximité (voir .grimoire-app, overflow-y:
         visible volontaire, theme.css.js). "contain" semblait alors
         provoquer un rebond élastique répété au geste (tactile/pavé tactile)
         au lieu d'un simple défilement, sur Chrome desktop comme d'après les
         essais de l'utilisateur — la valeur par défaut ("auto") laisse le
         rebond natif se dérouler normalement sans le contenir artificiellement
         à la racine du document.
         min-height: 100dvh également RETIRÉ (redondant de toute façon avec
         min-height: 100vh déjà posé sur .grimoire-app/.loading-screen, voir
         theme.css.js) : "dvh" n'a de sens que sur mobile (barre d'adresse qui
         apparaît/disparaît) et a des bugs de recalcul connus sur certains
         Chromium desktop — un traceur sur window.scrollTo() a confirmé que le
         rebond au geste sur la grille de recettes n'est déclenché par AUCUN
         appel JS de l'app (jamais loggé pendant le rebond) : c'est donc un
         comportement natif du navigateur pendant le défilement, pas un
         appel scripté — dvh est la piste suivante la plus plausible. */
      html, body {
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
    <link rel="apple-touch-icon" href="/Icon.jpeg">
    <!-- "default", surtout PAS "black-translucent" : une fois l'app ajoutée à
         l'écran d'accueil, black-translucent place la webview en plein écran
         à partir de y=0 (sous la Dynamic Island) mais lui laisse une hauteur
         de viewport amputée de cette même zone. Mesuré image par image sur
         l'appareil : 812pt de viewport pour 874pt d'écran réel — exactement
         les 62pt de env(safe-area-inset-top). Tout "position: fixed;
         bottom: 0" (.bottom-nav en tête) s'ancre alors 62pt au-dessus du vrai
         bas de l'écran, le contenu continue de défiler dans la bande morte du
         bas, et WebKit alterne entre les deux références d'un repaint à
         l'autre — d'où la nav tantôt bien placée tantôt remontée, et ses
         libellés rognés quand sa boîte tombe à cheval sur la frontière. Ce
         méta est ignoré dans un onglet Safari normal, ce qui explique que le
         bug ne se voyait QUE dans l'app installée. Avec "default", iOS place
         la webview sous la barre d'état et sa hauteur correspond enfin à la
         place qu'elle occupe réellement. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f5f0e1">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
